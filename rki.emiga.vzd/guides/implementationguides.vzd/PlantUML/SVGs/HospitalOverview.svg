<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="666px" preserveAspectRatio="none" style="width:1206px;height:666px;background:#FFFFFF;" version="1.1" viewBox="0 0 1206 666" width="1206px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="305" x="443.75" y="24.5332">&#220;berblick der Krankenhaus-Einrichtungen</text><!--entity EmigaHospitalFacilityLocation--><g id="elem_EmigaHospitalFacilityLocation"><rect fill="#F1F1F1" height="72.8281" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="449" x="7" y="316.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="208" x="17" y="341.1426">EmigaHospitalFacilityLocation</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="429" x="17" y="358.752">Krankenhaus - Einrichtungsstandort bildet Einrichtungen nach InEK-</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="386" x="17" y="376.3613">Standortverzeichnis oder Stationen eines Krankenhauses ab.</text></g><!--entity EmigaHospitalLocation--><g id="elem_EmigaHospitalLocation"><rect fill="#F1F1F1" height="125.6563" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="478" x="634.5" y="45.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="159" x="644.5" y="70.1426">EmigaHospitalLocation</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="424" x="644.5" y="87.752">Dieses Profil bildet einen Standort eines Krankenhauses im Kontext</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="444" x="644.5" y="105.3613">von EMIGA ab. Es dient der strukturierten Erfassung von besuchbaren</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="458" x="644.5" y="122.9707">Krankenhaus-Standorten (z. B. Hauptstandort, Klinikgeb&#228;ude, Stationen)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="414" x="644.5" y="140.5801">einschlie&#223;lich Adress- und ggf. Geokoordinaten f&#252;r die Nutzung in</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="362" x="644.5" y="158.1895">Melde-, Dokumentations- und Kommunikationsprozessen.</text></g><!--entity EmigaHospitalOrganization--><g id="elem_EmigaHospitalOrganization"><rect fill="#F1F1F1" height="143.2656" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="534" x="606.5" y="281.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="188" x="616.5" y="306.1426">EmigaHospitalOrganization</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="410" x="616.5" y="323.752">Profil zur Abbildung eines Krankenhauses im Kontext von EMIGA.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="472" x="616.5" y="341.3613">Es dient der strukturierten Erfassung von Stammdaten des Krankenhauses</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="443" x="616.5" y="358.9707">(z. B. Name, Kennziffern, Kontakt- und Adressdaten) f&#252;r die Nutzung in</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="514" x="616.5" y="376.5801">Melde-, Dokumentations- und Kommunikationsprozessen. Wenn ein Krankenhaus</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="330" x="620.5" y="394.1895">aus InEK importiert wird dann besizt keine Addresse.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="413" x="620.5" y="411.7988">Die Adressen sind im Standort (EmigaHospitalLocation) zu finden.</text></g><!--entity EmigaHospitalRoomLocation--><g id="elem_EmigaHospitalRoomLocation"><rect fill="#F1F1F1" height="125.6563" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="486" x="630.5" y="534.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="199" x="640.5" y="559.1426">EmigaHospitalRoomLocation</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="438" x="640.5" y="576.752">Dieses Profil bildet einen Raum in einem Krankenhaus im Kontext von</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="466" x="640.5" y="594.3613">EMIGA ab. Es dient der strukturierten Erfassung von r&#228;umlichen Einheiten</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="465" x="640.5" y="611.9707">innerhalb eines Krankenhausstandorts (z. B. Zimmer, Behandlungsr&#228;ume,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="425" x="640.5" y="629.5801">Isolationsbereiche) einschlie&#223;lich ihrer Identifikation und Zuordnung</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="274" x="640.5" y="647.1895">zu &#252;bergeordneten Einrichtungseinheiten.</text></g><!--link EmigaHospitalLocation to EmigaHospitalOrganization--><!--link EmigaHospitalLocation to EmigaHospitalOrganization--><g id="link_EmigaHospitalLocation_EmigaHospitalOrganization"><path d="M793.83,171.8894 C793.83,205.4294 793.83,240.7394 793.83,275.4494 " fill="none" id="EmigaHospitalLocation-to-EmigaHospitalOrganization" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="793.83,281.4494,797.83,272.4494,793.83,276.4494,789.83,272.4494,793.83,281.4494" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="127" x="665.83" y="210.0883">Verwaltende Einrichtung</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="115" x="665.83" y="223.9243">(managingOrganization)</text></g><!--link EmigaHospitalFacilityLocation to EmigaHospitalOrganization--><!--link EmigaHospitalFacilityLocation to EmigaHospitalOrganization--><g id="link_EmigaHospitalFacilityLocation_EmigaHospitalOrganization"><path d="M456.04,341.6094 C504.58,341.6094 550.37,341.6094 600.37,341.6094 " fill="none" id="EmigaHospitalFacilityLocation-to-EmigaHospitalOrganization" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="606.37,341.6094,597.37,337.6094,601.37,341.6094,597.37,345.6094,606.37,341.6094" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="127" x="467.7" y="354.0283">Verwaltende Einrichtung</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="115" x="467.7" y="367.8643">(managingOrganization)</text></g><!--link EmigaHospitalOrganization to EmigaHospitalRoomLocation--><!--reverse link EmigaHospitalOrganization to EmigaHospitalRoomLocation--><g id="link_EmigaHospitalOrganization_EmigaHospitalRoomLocation"><path d="M792.5,430.8194 C792.5,465.4794 792.5,500.7194 792.5,534.2194 " fill="none" id="EmigaHospitalOrganization-backto-EmigaHospitalRoomLocation" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="792.5,424.8194,788.5,433.8194,792.5,429.8194,796.5,433.8194,792.5,424.8194" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="127" x="664.5" y="462.9383">Verwaltende Einrichtung</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="115" x="664.5" y="476.7743">(managingOrganization)</text></g><!--reverse link EmigaHospitalLocation to EmigaHospitalFacilityLocation--><g id="link_EmigaHospitalLocation_EmigaHospitalFacilityLocation"><path d="M628.44,108.6094 C445.91,108.6094 231.5,108.6094 231.5,108.6094 C231.5,108.6094 231.5,248.2994 231.5,316.5094 " fill="none" id="EmigaHospitalLocation-backto-EmigaHospitalFacilityLocation" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="634.44,108.6094,625.44,104.6094,629.44,108.6094,625.44,112.6094,634.44,108.6094" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="37" x="289.02" y="92.0283">Teil von</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="39" x="289.02" y="105.8643">(partOf)</text></g><!--reverse link EmigaHospitalLocation to EmigaHospitalRoomLocation--><g id="link_EmigaHospitalLocation_EmigaHospitalRoomLocation"><path d="M1118.71,108.6094 C1146.13,108.6094 1158.5,108.6094 1158.5,108.6094 C1158.5,108.6094 1158.5,597.6094 1158.5,597.6094 C1158.5,597.6094 1141.92,597.6094 1116.75,597.6094 " fill="none" id="EmigaHospitalLocation-backto-EmigaHospitalRoomLocation" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1112.71,108.6094,1121.71,112.6094,1117.71,108.6094,1121.71,104.6094,1112.71,108.6094" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="37" x="1159.5" y="334.5083">Teil von</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="39" x="1159.5" y="348.3443">(partOf)</text></g><!--SRC=[jPRFRjj64CRlV8f1Bh4CKOWFlUHGG4QKn52S14xG0YbxM8f3Sa3khB1_ufhFKg2NFaPkUh7EKf9DEpBZ6AvkuYvdllbzCxlqv5k4pTyvshobLG