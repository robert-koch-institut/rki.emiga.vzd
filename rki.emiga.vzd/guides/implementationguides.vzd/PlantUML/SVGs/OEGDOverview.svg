<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="648px" preserveAspectRatio="none" style="width:1480px;height:648px;background:#FFFFFF;" version="1.1" viewBox="0 0 1480 648" width="1480px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="317" x="574.75" y="24.5332">Resourcen-&#220;berblick der &#214;GD-Einrichtungen</text><!--entity EmigaPublicHealthOrganization--><g id="elem_EmigaPublicHealthOrganization"><rect fill="#F1F1F1" height="72.8281" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="543" x="261" y="298.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="219" x="271" y="323.1426">EmigaPublicHealthOrganization</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="458" x="271" y="340.752">Unter der &#214;GD Einrichtung werden alle Einrichtungen zusammengefasst,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="523" x="271" y="358.3613">die EMIGA direkt nutzende &#214;GD-Einrichtungen sind, die eine CodeSite-ID besitzen.</text></g><!--entity IdentifierCodeSiteId--><g id="elem_IdentifierCodeSiteId"><rect fill="#F1F1F1" height="72.8281" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="460" x="302.5" y="560.1094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="141" x="312.5" y="584.6426">IdentifierCodeSiteId</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="440" x="312.5" y="602.252">Identifier-Profil f&#252;r die vom RKI vergebene Kennung der Einrichtungen</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="300" x="312.5" y="619.8613">des &#214;GD (Gesundheitsamt, Landesstelle usw.).</text></g><!--entity EmigaPublicHealthLocation--><g id="elem_EmigaPublicHealthLocation"><rect fill="#F1F1F1" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="552" x="922.5" y="551.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="190" x="932.5" y="576.1426">EmigaPublicHealthLocation</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="532" x="932.5" y="593.752">Physischer Standort eines &#214;GD-Fachbereichs, an dem Leistungen erbracht werden.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="528" x="932.5" y="611.3613">Der Standort ist in der Regel &#252;ber eine Adresse und optional &#252;ber Geo-Koordinaten</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="172" x="932.5" y="628.9707">eindeutig r&#228;umlich verortet.</text></g><!--entity EmigaPractitioner--><g id="elem_EmigaPractitioner"><rect fill="#F1F1F1" height="72.8281" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="447" x="7" y="45.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="124" x="17" y="70.1426">EmigaPractitioner</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="427" x="17" y="87.752">Person, die im Kontext des &#214;GD Leistungen erbringt bzw. Aufgaben</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="282" x="17" y="105.3613">innerhalb einer &#214;GD-Einrichtung wahrnimmt.</text></g><!--entity EmigaPractitionerRole--><g id="elem_EmigaPractitionerRole"><rect fill="#F1F1F1" height="72.8281" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="510" x="614.5" y="45.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="156" x="624.5" y="70.1426">EmigaPractitionerRole</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="422" x="624.5" y="87.752">Beschreibt die Rolle einer Person innerhalb einer &#214;GD-Einrichtung</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="490" x="624.5" y="105.3613">sowie die damit verbundenen organisatorischen und fachlichen Zuordnungen.</text></g><!--entity EmigaHealthcareService--><g id="elem_EmigaHealthcareService"><rect fill="#F1F1F1" height="72.8281" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="446" x="982.5" y="298.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="172" x="992.5" y="323.1426">EmigaHealthcareService</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="426" x="992.5" y="340.752">Beschreibung einer Dienstleistung, die durch eine &#214;GD-Einrichtung</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="267" x="992.5" y="358.3613">bzw. an deren Standorten angeboten wird.</text></g><!--link EmigaPractitioner to EmigaPractitionerRole--><!--reverse link EmigaPractitioner to EmigaPractitionerRole--><g id="link_EmigaPractitioner_EmigaPractitionerRole"><path d="M460.44,94.6094 C512.16,94.6094 561.55,94.6094 614.48,94.6094 " fill="none" id="EmigaPractitioner-backto-EmigaPractitionerRole" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="454.44,94.6094,463.44,98.6094,459.44,94.6094,463.44,90.6094,454.44,94.6094" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="107" x="468.96" y="107.0283">Person, der die f&#252;r die</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="107" x="471.96" y="120.8643">Einrichtung definierten</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="128" x="471.96" y="134.7002">Leistungen erbringen kann</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="62" x="468.96" y="148.5361">(practitioner)</text></g><!--link EmigaPractitionerRole to EmigaHealthcareService--><!--link EmigaPractitionerRole to EmigaHealthcareService--><g id="link_EmigaPractitionerRole_EmigaHealthcareService"><path d="M1029.83,118.6294 C1029.83,166.6594 1029.83,244.5794 1029.83,292.5994 " fill="none" id="EmigaPractitionerRole-to-EmigaHealthcareService" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1029.83,298.5994,1033.83,289.5994,1029.83,293.5994,1025.83,289.5994,1029.83,298.5994" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="82" x="907.83" y="150.0383">Dienstleistungen,</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="90" x="910.83" y="163.8743">die der Practitioner</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="115" x="907.83" y="177.7102">f&#252;r die Einrichtung bzw.</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="118" x="910.83" y="191.5461">deren Standorte erbringt</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="96" x="907.83" y="205.3821">(healthcareService)</text></g><!--link EmigaPractitionerRole to EmigaPublicHealthOrganization--><!--link EmigaPractitionerRole to EmigaPublicHealthOrganization--><g id="link_EmigaPractitionerRole_EmigaPublicHealthOrganization"><path d="M709.25,118.6294 C709.25,166.6594 709.25,244.5794 709.25,292.5994 " fill="none" id="EmigaPractitionerRole-to-EmigaPublicHealthOrganization" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="709.25,298.5994,713.25,289.5994,709.25,293.5994,705.25,289.5994,709.25,298.5994" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="129" x="579.25" y="178.0383">Einrichtung, in der die Rolle</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="112" x="579.25" y="191.8743">ausge&#252;bt werden kann</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="67" x="579.25" y="205.7102">(organization)</text></g><!--link IdentifierCodeSiteId to EmigaPublicHealthOrganization--><!--link EmigaPublicHealthOrganization to IdentifierCodeSiteId--><g id="link_EmigaPublicHealthOrganization_IdentifierCodeSiteId"><path d="M609.17,371.7494 C609.17,421.5094 609.17,503.9494 609.17,553.7994 " fill="none" id="EmigaPublicHealthOrganization-to-IdentifierCodeSiteId" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="609.17,559.7994,613.17,550.7994,609.17,554.7994,605.17,550.7994,609.17,559.7994" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="33" x="575.17" y="463.1883">Besitzt</text></g><!--link EmigaPublicHealthOrganization to EmigaPublicHealthLocation--><!--reverse link EmigaPublicHealthOrganization to EmigaPublicHealthLocation--><g id="link_EmigaPublicHealthOrganization_EmigaPublicHealthLocation"><path d="M783.25,377.8494 C783.25,440.3394 783.25,554.6094 783.25,554.6094 C783.25,554.6094 845.82,554.6094 922.39,554.6094 " fill="none" id="EmigaPublicHealthOrganization-backto-EmigaPublicHealthLocation" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="783.25,371.8494,779.25,380.8494,783.25,376.8494,787.25,380.8494,783.25,371.8494" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="119" x="663.25" y="516.2183">Verwaltende Einrichtung</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="115" x="663.25" y="530.0543">(managingOrganization)</text></g><!--reverse link EmigaPublicHealthOrganization to EmigaHealthcareService--><g id="link_EmigaPublicHealthOrganization_EmigaHealthcareService"><path d="M810.29,335.6094 C869.49,335.6094 925.45,335.6094 982.49,335.6094 " fill="none" id="EmigaPublicHealthOrganization-backto-EmigaHealthcareService" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="804.29,335.6094,813.29,339.6094,809.29,335.6094,813.29,331.6094,804.29,335.6094" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="83" x="809.39" y="348.0283">Bereitgestellt von</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="63" x="809.39" y="361.8643">(providedBy)</text></g><!--link EmigaHealthcareService to EmigaPublicHealthLocation--><g id="link_EmigaHealthcareService_EmigaPublicHealthLocation"><path d="M1205.5,371.7494 C1205.5,418.8294 1205.5,494.5694 1205.5,545.4494 " fill="none" id="EmigaHealthcareService-to-EmigaPublicHealthLocation" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1205.5,551.4494,1209.5,542.4494,1205.5,546.4494,1201.5,542.4494,1205.5,551.4494" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="147" x="993.5" y="431.0183">Referenzierung der Standorte,</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="211" x="993.5" y="444.8543">an denen die Dienstleistung angeboten wird</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="45" x="993.5" y="458.6902">(location)</text></g><!--reverse link EmigaPublicHealthOrganization to EmigaPublicHealthOrganization--><g id="link_EmigaPublicHealthOrganization_EmigaPublicHealthOrganization"><path d="M756.62,292.5194 C756.62,255.1594 756.62,208.6094 756.62,208.6094 C756.62,208.6094 863.25,208.6094 863.25,208.6094 C863.25,208.6094 863.25,461.6094 863.25,461.6094 C863.25,461.6094 793.62,461.6094 793.62,461.6094 C793.62,461.6094 793.62,409.0594 793.62,371.6994 " fill="none" id="EmigaPublicHealthOrganization-backto-EmigaPublicHealthOrganization" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="756.62,298.5194,760.62,289.5194,756.62,293.5194,752.62,289.5194,756.62,298.5194" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="37" x="818.25" y="295.0283">Teil von</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="39" x="818.25" y="308.8643">(partOf)</text></g><!--SRC=[fLPDSzis4BthL-paueyndVZIwVJW6RjsN8_TiKTAScZL0oIiI8p9XGPOMhL-I4uzzcVafZ_M1IWgf4LQgUsJ312Bj-_jlWKRpX66w6tffaZ9wfy9kabkfW-WqS7gwzL5Scd8cMd69QL8Wm7RER25YMMs1MZZSCh6oeP_C3HNJXNWCwNjmb0ACvLxREpaXf2VvWZMSMOR6nfdgipv4_xDPxb9gK1Yo776ZM_EdBEBZvPuP9O89oVDAybgz3Y7avy-D5QTeeUu-lE7mM0Ga2fA9U5tXuUNXKdLVHbo_GrLpjcTInMPfGh971wEwJEnC52p00qMO85E8u7A9LIB7LYMNXM2FPLqlEUZCMaZt_n-VNKMgNfWe9ANI1exo0LlI1z1E8925FmgIOqCOt9z0HFq9XmyVWVAmuledsLwBLZPp0owEjwr3Wb-Nq_kdPsP76QhRoxU_YZA3c-kuH5TYXCKA3T8558FVBGmIuReAuhshz2Nf3CqB2pm4TogiEaP0r6bNnmVLEYx4EsIvzPEDzBSPq_U-6acM4PoH4inHS8g7Cb7DSsaZ54m-YDG9A0Bk4NZronBXJlvXDSw7e_feXb9lWD3CTCXffZ3wfj4gnGvqquIacH8Wvq7FAhUlqARt5Zhj275WHSveB5aau9R_LiMaaaM29Kha7jKh9Fi94Cmimcxw289wBobgbfC0JVI5z8yi57ZMSBIZGoJvU8OpifPgYO1eI69bQby4fFRRdTOgCoHAOeMtWQENJY7DiU0zHn5BH5amX6kBEUulhDA0tP16PCNHy5uNAl2SA1o8Z98SPAuIQX-hzYwM1SK1Pg9o85r-VUFKeIXo4PFAW5gLpgLC5FbS8JkqKp