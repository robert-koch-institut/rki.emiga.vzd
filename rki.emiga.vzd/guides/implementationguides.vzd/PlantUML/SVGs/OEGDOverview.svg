<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="648px" preserveAspectRatio="none" style="width:1480px;height:648px;background:#FFFFFF;" version="1.1" viewBox="0 0 1480 648" width="1480px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="244" x="611.25" y="24.5332">&#220;berblick der &#214;GD-Organisationen</text><!--entity EmigaPublicHealthOrganization--><g id="elem_EmigaPublicHealthOrganization"><rect fill="#F1F1F1" height="72.8281" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="553" x="251" y="298.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="219" x="261" y="323.1426">EmigaPublicHealthOrganization</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="478" x="261" y="340.752">Unter der &#214;GD Organisation werden alle Organisationen zusammengefasst,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="533" x="261" y="358.3613">die EMIGA direkt nutzende &#214;GD-Organisationen sind, die eine CodeSite-ID besitzen.</text></g><!--entity IdentifierCodeSiteId--><g id="elem_IdentifierCodeSiteId"><rect fill="#F1F1F1" height="72.8281" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="470" x="292.5" y="560.1094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="141" x="302.5" y="584.6426">IdentifierCodeSiteId</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="450" x="302.5" y="602.252">Identifier-Profil f&#252;r die vom RKI vergebene Kennung der Organisationen</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="300" x="302.5" y="619.8613">des &#214;GD (Gesundheitsamt, Landesstelle usw.).</text></g><!--entity EmigaPublicHealthLocation--><g id="elem_EmigaPublicHealthLocation"><rect fill="#F1F1F1" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="552" x="922.5" y="551.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="190" x="932.5" y="576.1426">EmigaPublicHealthLocation</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="532" x="932.5" y="593.752">Physischer Standort eines &#214;GD-Fachbereichs, an dem Leistungen erbracht werden.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="528" x="932.5" y="611.3613">Der Standort ist in der Regel &#252;ber eine Adresse und optional &#252;ber Geo-Koordinaten</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="172" x="932.5" y="628.9707">eindeutig r&#228;umlich verortet.</text></g><!--entity EmigaPractitioner--><g id="elem_EmigaPractitioner"><rect fill="#F1F1F1" height="72.8281" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="447" x="7" y="45.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="124" x="17" y="70.1426">EmigaPractitioner</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="427" x="17" y="87.752">Person, die im Kontext des &#214;GD Leistungen erbringt bzw. Aufgaben</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="292" x="17" y="105.3613">innerhalb einer &#214;GD-Organisation wahrnimmt.</text></g><!--entity EmigaPractitionerRole--><g id="elem_EmigaPractitionerRole"><rect fill="#F1F1F1" height="72.8281" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="510" x="614.5" y="45.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="156" x="624.5" y="70.1426">EmigaPractitionerRole</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="432" x="624.5" y="87.752">Beschreibt die Rolle einer Person innerhalb einer &#214;GD-Organisation</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="490" x="624.5" y="105.3613">sowie die damit verbundenen organisatorischen und fachlichen Zuordnungen.</text></g><!--entity EmigaHealthcareService--><g id="elem_EmigaHealthcareService"><rect fill="#F1F1F1" height="72.8281" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="456" x="982.5" y="298.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="172" x="992.5" y="323.1426">EmigaHealthcareService</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="436" x="992.5" y="340.752">Beschreibung einer Dienstleistung, die durch eine &#214;GD-Organisation</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="267" x="992.5" y="358.3613">bzw. an deren Standorten angeboten wird.</text></g><!--link EmigaPractitioner to EmigaPractitionerRole--><!--reverse link EmigaPractitioner to EmigaPractitionerRole--><g id="link_EmigaPractitioner_EmigaPractitionerRole"><path d="M460.44,94.6094 C512.16,94.6094 561.55,94.6094 614.48,94.6094 " fill="none" id="EmigaPractitioner-backto-EmigaPractitionerRole" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="454.44,94.6094,463.44,98.6094,459.44,94.6094,463.44,90.6094,454.44,94.6094" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="107" x="468.96" y="107.0283">Person, der die f&#252;r die</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="115" x="471.96" y="120.8643">Organisation definierten</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="128" x="471.96" y="134.7002">Leistungen erbringen kann</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="62" x="468.96" y="148.5361">(practitioner)</text></g><!--link EmigaPractitionerRole to EmigaHealthcareService--><!--link EmigaPractitionerRole to EmigaHealthcareService--><g id="link_EmigaPractitionerRole_EmigaHealthcareService"><path d="M1029.83,118.6294 C1029.83,166.6594 1029.83,244.5794 1029.83,292.5994 " fill="none" id="EmigaPractitionerRole-to-EmigaHealthcareService" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1029.83,298.5994,1033.83,289.5994,1029.83,293.5994,1025.83,289.5994,1029.83,298.5994" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="82" x="905.83" y="150.0383">Dienstleistungen,</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="90" x="908.83" y="163.8743">die der Practitioner</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="123" x="905.83" y="177.7102">f&#252;r die Organisation bzw.</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="118" x="908.83" y="191.5461">deren Standorte erbringt</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="96" x="905.83" y="205.3821">(healthcareService)</text></g><!--link EmigaPractitionerRole to EmigaPublicHealthOrganization--><!--link EmigaPractitionerRole to EmigaPublicHealthOrganization--><g id="link_EmigaPractitionerRole_EmigaPublicHealthOrganization"><path d="M709.25,118.6294 C709.25,166.6594 709.25,244.5794 709.25,292.5994 " fill="none" id="EmigaPractitionerRole-to-EmigaPublicHealthOrganization" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="709.25,298.5994,713.25,289.5994,709.25,293.5994,705.25,289.5994,709.25,298.5994" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="137" x="571.25" y="178.0383">Organisation, in der die Rolle</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="112" x="571.25" y="191.8743">ausge&#252;bt werden kann</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="67" x="571.25" y="205.7102">(organization)</text></g><!--link IdentifierCodeSiteId to EmigaPublicHealthOrganization--><!--link EmigaPublicHealthOrganization to IdentifierCodeSiteId--><g id="link_EmigaPublicHealthOrganization_IdentifierCodeSiteId"><path d="M605.83,371.7494 C605.83,421.5094 605.83,503.9494 605.83,553.7994 " fill="none" id="EmigaPublicHealthOrganization-to-IdentifierCodeSiteId" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="605.83,559.7994,609.83,550.7994,605.83,554.7994,601.83,550.7994,605.83,559.7994" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="32" x="572.83" y="463.1883">besitzt</text></g><!--link EmigaPublicHealthOrganization to EmigaPublicHealthLocation--><!--reverse link EmigaPublicHealthOrganization to EmigaPublicHealthLocation--><g id="link_EmigaPublicHealthOrganization_EmigaPublicHealthLocation"><path d="M783.25,377.8494 C783.25,440.3394 783.25,554.6094 783.25,554.6094 C783.25,554.6094 845.82,554.6094 922.39,554.6094 " fill="none" id="EmigaPublicHealthOrganization-backto-EmigaPublicHealthLocation" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="783.25,371.8494,779.25,380.8494,783.25,376.8494,787.25,380.8494,783.25,371.8494" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="127" x="655.25" y="516.2183">Verwaltende Organisation</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="115" x="655.25" y="530.0543">(managingOrganization)</text></g><!--reverse link EmigaPublicHealthOrganization to EmigaHealthcareService--><g id="link_EmigaPublicHealthOrganization_EmigaHealthcareService"><path d="M810.32,335.6094 C869.48,335.6094 925.33,335.6094 982.42,335.6094 " fill="none" id="EmigaPublicHealthOrganization-backto-EmigaHealthcareService" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="804.32,335.6094,813.32,339.6094,809.32,335.6094,813.32,331.6094,804.32,335.6094" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="82" x="810.37" y="348.0283">bereitgestellt von</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="63" x="810.37" y="361.8643">(providedBy)</text></g><!--link EmigaHealthcareService to EmigaPublicHealthLocation--><g id="link_EmigaHealthcareService_EmigaPublicHealthLocation"><path d="M1210.5,371.7494 C1210.5,418.8294 1210.5,494.5694 1210.5,545.4494 " fill="none" id="EmigaHealthcareService-to-EmigaPublicHealthLocation" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1210.5,551.4494,1214.5,542.4494,1210.5,546.4494,1206.5,542.4494,1210.5,551.4494" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="147" x="998.5" y="431.0183">Referenzierung der Standorte,</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="211" x="998.5" y="444.8543">an denen die Dienstleistung angeboten wird</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="45" x="998.5" y="458.6902">(location)</text></g><!--reverse link EmigaPublicHealthOrganization to EmigaPublicHealthOrganization--><g id="link_EmigaPublicHealthOrganization_EmigaPublicHealthOrganization"><path d="M756.62,292.5194 C756.62,255.1594 756.62,208.6094 756.62,208.6094 C756.62,208.6094 863.25,208.6094 863.25,208.6094 C863.25,208.6094 863.25,461.6094 863.25,461.6094 C863.25,461.6094 793.62,461.6094 793.62,461.6094 C793.62,461.6094 793.62,409.0594 793.62,371.6994 " fill="none" id="EmigaPublicHealthOrganization-backto-EmigaPublicHealthOrganization" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="756.62,298.5194,760.62,289.5194,756.62,293.5194,752.62,289.5194,756.62,298.5194" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="37" x="818.25" y="295.0283">Teil von</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="39" x="818.25" y="308.8643">(partOf)</text></g><!--SRC=[fLR1RkCs4BtxAmPxIHnOsSsbAFOGmDjaKoCf4iJR7bhtG9aZYR0qD4WgRlmXFVNOpzYRVwn3ol9AjXHlavmSKXo-UM_c3ProESBcdnXDdAlv0YGQsFnzSnNTcrIGii8fJKY3WTDBS1fYxPmkG2g3Sxyr6DY5egKmeW2R2QbNYb98H6wniPChGlUyHD36PRgn8J4HPUw-u5zkdAkK2YG7EIQkyStO6BtwhCbDrHhXug9v9Mc95fTmySE7ngeHj0YhFtuO30OUgQ2KytntTdPTg5Gyb3xPdr7aBgloN8Sypyvcz2ivfg2c0Peqm0gDH0AHSwmsFx0khIWOVSe9MUj6Cv8AuVgNoSquaBLmGALR8qdiuXUi8Za2VmQPA_Y9yvegXz7a2cAqofyyVmV2mei9x2KxORHE9GfD7MyYVOxVrgC7enELGxBvQiBjJopku-q4dj2a62D3kKMYaZNrbBH1SuveAvfERz2M93DKZdbm8xWJVjCwz5oLTdK-hE1tGJecqPsUx-Hvo9wjilECmKpvYEI22enLEABFOfvnBQEQPtO4WXXr0NUehECKc6OkSyEVkAsKvpEwQaRYxq1HIFKHKynXyvMZLPACfU64E1cIe9SUZwZtRr17jreRgKWupmiVa5WwbOBP_5iMd4dc6UKhqFN8M2VPIGPZTYgGRW89QAocgbnK0RVS6zn0i5DZBs7kI0VnUdKEup99HUmHAk9OcSZZa5n7pyDAP8PKKRG0Du0S0_geS_HWFo7BnOh4Bk3bvHotbrPvm54iCxBiAnZEIr4evycCMGZqhQFhBxK9bK51eeHbzhpplx-NB0q5FdfoyLYxygcacGk3KpHFQjvEo7T5XVXA8