<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="646px" preserveAspectRatio="none" style="width:1873px;height:646px;background:#FFFFFF;" version="1.1" viewBox="0 0 1873 646" width="1873px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="373" x="743.25" y="24.5332">Resourcen-&#220;berblick der generischen Einrichtungen</text><!--entity EmigaDepartmentOrganization--><g id="elem_EmigaDepartmentOrganization"><rect fill="#F1F1F1" height="72.8281" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="453" x="741.5" y="558.1094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="213" x="751.5" y="582.6426">EmigaDepartmentOrganization</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="433" x="751.5" y="600.252">Unter einer Fachabteilung versteht man einen organisatorischen Teil</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="259" x="751.5" y="617.8613">einer Abteilung (nicht der physische Ort).</text></g><!--entity EmigaHealthcareService--><g id="elem_EmigaHealthcareService"><rect fill="#F1F1F1" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="437" x="1430.5" y="324.1094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="172" x="1440.5" y="348.6426">EmigaHealthcareService</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="417" x="1440.5" y="366.252">Beschreibung einer Dienstleistung, die im weitesten Sinne mit dem</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="356" x="1440.5" y="383.8613">Gesundheitswesen assoziiert ist, z. B. Tuberkulosestelle,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="384" x="1440.5" y="401.4707">Lebensmittelpersonal-Beratungsstelle, AIDS-Beratungsstelle.</text></g><!--entity EmigaLocation--><g id="elem_EmigaLocation"><rect fill="#F1F1F1" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="507" x="1334.5" y="549.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="102" x="1344.5" y="574.1426">EmigaLocation</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="487" x="1344.5" y="591.752">Ein 'physischer' Ort, der besucht werden kann. Einem physischen Ort k&#246;nnen</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="447" x="1344.5" y="609.3613">grunds&#228;tzlich Geo-Koordinaten und zumeist auch eine Stra&#223;enadresse</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="125" x="1344.5" y="626.9707">zugeordnet werden.</text></g><!--entity EmigaOrganization--><g id="elem_EmigaOrganization"><rect fill="#F1F1F1" height="160.875" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="609" x="663.5" y="288.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="131" x="673.5" y="313.1426">EmigaOrganization</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="501" x="673.5" y="330.752">Unter der EMIGA Organization werden alle Einrichtungen zusammengefasst, die</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="544" x="673.5" y="348.3613">NICHT EMIGA direkt nutzende &#214;GD-Einrichtungen sind, die eine CodeSite-ID besitzen.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="538" x="673.5" y="365.9707">Damit werden unter EMIGA Einrichtungen sowohl Beh&#246;rden, Transport-Unternehmen,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="589" x="673.5" y="383.5801">wie Krankenh&#228;user, Labore oder Arztpraxen aber auch jede andere Einrichtung subsummiert.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="486" x="673.5" y="401.1895">Die jeweiligen Einrichtungen werden durch ihren Typ und/oder ihren Identifier</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="466" x="673.5" y="418.7988">eindeutig charakterisiert. EmigaEinrichtungen m&#252;ssen nicht zwingend eine</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="523" x="673.5" y="436.4082">Stra&#223;enanschrift haben, verf&#252;gen h&#228;ufig jedoch zumindest &#252;ber eine Postanschrift.</text></g><!--entity EmigaPractitioner--><g id="elem_EmigaPractitioner"><rect fill="#F1F1F1" height="143.2656" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="540" x="7" y="45.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="124" x="17" y="70.1426">EmigaPractitioner</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="487" x="17" y="87.752">Personen, die im weiteren Sinne einen Bezug zur Erbringung von Leistungen/</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="518" x="17" y="105.3613">Erf&#252;llung von Aufgaben innerhalb der Gesundheitsversorgung (hier: &#214;GD) haben.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="470" x="17" y="122.9707">Dies sind somit explizit nicht nur &#196;rztinnen und &#196;rzte, sondern auch andere</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="408" x="17" y="140.5801">Personengruppen, wie z. B. MitarbeiterInnen im Gesundheitsamt,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="431" x="17" y="158.1895">LeiterInnen/AnsprechpartnerInnen von Gemeinschaftseinrichtungen.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="520" x="17" y="175.7988">Patienten, Kontaktpersonen etc. fallen jedoch explizit NICHT unter diese Kategorie.</text></g><!--entity EmigaPractitionerRole--><g id="elem_EmigaPractitionerRole"><rect fill="#F1F1F1" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="562" x="687" y="72.1094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="156" x="697" y="96.6426">EmigaPractitionerRole</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="511" x="697" y="114.252">Definiert einen bestimmten Satz von Attributen, die einem Practitioner zugeordnet</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="542" x="697" y="131.8613">werden. Dazu geh&#246;ren beispielsweise die Zuordnung zu einer bestimmten Einrichtung,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="287" x="697" y="149.4707">aber auch die Rolle, die wahrgenommen wird.</text></g><!--link EmigaPractitioner to EmigaPractitionerRole--><!--reverse link EmigaPractitioner to EmigaPractitionerRole--><g id="link_EmigaPractitioner_EmigaPractitionerRole"><path d="M553.13,102.6094 C599.02,102.6094 640.79,102.6094 686.96,102.6094 " fill="none" id="EmigaPractitioner-backto-EmigaPractitionerRole" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="547.13,102.6094,556.13,106.6094,552.13,102.6094,556.13,98.6094,547.13,102.6094" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="93" x="563.54" y="115.0283">Practitioner, der die</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="87" x="566.54" y="128.8643">f&#252;r die Einrichtung</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="107" x="563.54" y="142.7002">definierten Leistungen</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="72" x="566.54" y="156.5361">erbringen kann</text></g><!--link EmigaDepartmentOrganization to EmigaOrganization--><!--reverse link EmigaOrganization to EmigaDepartmentOrganization--><g id="link_EmigaOrganization_EmigaDepartmentOrganization"><path d="M1043.5,455.8794 C1043.5,492.7894 1043.5,528.6694 1043.5,557.8494 " fill="none" id="EmigaOrganization-backto-EmigaDepartmentOrganization" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1043.5,449.8794,1039.5,458.8794,1043.5,454.8794,1047.5,458.8794,1043.5,449.8794" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="119" x="923.5" y="487.2883">Verwaltende Einrichtung</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="115" x="923.5" y="501.1243">(managingOrganization)</text></g><!--link EmigaOrganization to EmigaHealthcareService--><!--reverse link EmigaOrganization to EmigaHealthcareService--><g id="link_EmigaOrganization_EmigaHealthcareService"><path d="M1278.65,384.6094 C1331.77,384.6094 1380.07,384.6094 1430.29,384.6094 " fill="none" id="EmigaOrganization-backto-EmigaHealthcareService" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1272.65,384.6094,1281.65,388.6094,1277.65,384.6094,1281.65,380.6094,1272.65,384.6094" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="83" x="1331.22" y="397.0283">Bereitgestellt von</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="63" x="1331.22" y="410.8643">(providedBy)</text></g><!--link EmigaOrganization to EmigaLocation--><!--reverse link EmigaOrganization to EmigaLocation--><g id="link_EmigaOrganization_EmigaLocation"><path d="M1233.5,455.8594 C1233.5,505.0894 1233.5,552.6094 1233.5,552.6094 C1233.5,552.6094 1277.31,552.6094 1334.14,552.6094 " fill="none" id="EmigaOrganization-backto-EmigaLocation" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1233.5,449.8594,1229.5,458.8594,1233.5,454.8594,1237.5,458.8594,1233.5,449.8594" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="119" x="1113.5" y="534.9783">Verwaltende Einrichtung</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="115" x="1113.5" y="548.8143">(managingOrganization)</text></g><!--link EmigaPractitionerRole to EmigaOrganization--><!--link EmigaPractitionerRole to EmigaOrganization--><g id="link_EmigaPractitionerRole_EmigaOrganization"><path d="M874.33,162.1594 C874.33,197.1994 874.33,240.7194 874.33,282.5394 " fill="none" id="EmigaPractitionerRole-to-EmigaOrganization" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="874.33,288.5394,878.33,279.5394,874.33,283.5394,870.33,279.5394,874.33,288.5394" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="129" x="744.33" y="208.7683">Einrichtung, in der die Rolle</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="112" x="744.33" y="222.6043">ausge&#252;bt werden kann</text></g><!--link EmigaPractitionerRole to EmigaHealthcareService--><g id="link_EmigaPractitionerRole_EmigaHealthcareService"><path d="M1249.41,117.6094 C1436.88,117.6094 1649,117.6094 1649,117.6094 C1649,117.6094 1649,245.4494 1649,317.8594 " fill="none" id="EmigaPractitionerRole-to-EmigaHealthcareService" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1649,323.8594,1653,314.8594,1649,318.8594,1645,314.8594,1649,323.8594" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="175" x="1315.33" y="101.0283">Dienstleistungen, die der Practitioner</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="236" x="1315.33" y="114.8643">f&#252;r die Einrichtung bzw. deren Standorte erbringt</text></g><!--reverse link EmigaOrganization to EmigaOrganization--><g id="link_EmigaOrganization_EmigaOrganization"><path d="M1260.75,282.3194 C1260.75,255.6194 1260.75,238.6094 1260.75,238.6094 C1260.75,238.6094 1303.5,238.6094 1303.5,238.6094 C1303.5,238.6094 1303.5,499.6094 1303.5,499.6094 C1303.5,499.6094 1253,499.6094 1253,499.6094 C1253,499.6094 1253,476.5994 1253,449.8994 " fill="none" id="EmigaOrganization-backto-EmigaOrganization" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1260.75,288.3194,1264.75,279.3194,1260.75,283.3194,1256.75,279.3194,1260.75,288.3194" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="37" x="1309.5" y="351.4083">Teil von</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="39" x="1309.5" y="365.2443">(partOf)</text></g><!--link EmigaHealthcareService to EmigaLocation--><g id="link_EmigaHealthcareService_EmigaLocation"><path d="M1636,414.1994 C1636,453.5294 1636,504.2894 1636,543.5994 " fill="none" id="EmigaHealthcareService-to-EmigaLocation" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1636,549.5994,1640,540.5994,1636,544.5994,1632,540.5994,1636,549.5994" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="147" x="1424" y="451.3183">Referenzierung der Standorte,</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="211" x="1424" y="465.1543">an denen die Dienstleistung angeboten wird</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="45" x="1424" y="478.9902">(location)</text></g><!--SRC=[hLV1Sjis4BthAp2vEF58IZBJam-PaQF4ySHfF9RRGwiUG7558Y8N702COftx3JrrffTyGqwvwSVw5XHbqfQJQQOvAGIm-_RjsmSuc52GkY9lQxSW7ct_JiWbXLciL4fEPSJaZ5_anEgLOMSMUQWPNmU3O2iLh4fi2BPKgN6q2CPYmQyCLzhfKlbSftPjE5DBNNZgh1I6ATnKfAmBkUqifBJKTH6kwLEO52RZaZYeWfQXisVYd5s_jXncPaFg-VDkIhOfUQhKyv-UTRuwpQluzTcpmM0WI3LdgFlHyV6hqcHwIjWN9DTxbsas6osb71_F-HSEe840rwdNUf7h990fG87wICu7oeCgDSSDZ6BaiDV1jfnTO_ESc-EJ_-8TUh8Uvhpfiu8Xo3sNUvEVItqGsKTbg6KykhT-Tb4TTVRgZJewmyf47fTGaCPfifBoz3pEVzy_lBDzIwGpEqgAAx3XZWbjVthR3hg1_66qqOjiSQNcB0P93CwdmglHWwEvppL8fmTb3h2RJBS2MRNDY_KAUNRBx9rgAundBw23unYaKmv04D3QoHyAuDBd6y_rvxSK5ten3gOXX0nSPjGEVr9AeS2covy8DIWKOZhKQ5ydVYwB4MxWXMXFn243uUvQsnj2IdyC5S6CuGflgcauKzZtkRJEVO4iqJ0EDufrS5a2lxWz2g8PSPKJQFxySljLo_Jr7Z0HkmHp4TkvxmN4CluccLGS1nX2Mwpt7wLyqB64hbGgWL2Y53IGuRRhydEgjIbzM4VeYEvxrd9fTCmSLab9xAxZBCh-RjcuVPUqTZUAK7c08AEkyIXdcYF4ER5pck8ds8wfO2YQDSczJAJqfG4ShakaYZlZkc8mS9Hes7ceFCaYlD9mqZJHH_52L69zkXJLPWDVZJCCl1i_uH8944piF6_C1xKX5pSIAPHossj6Fogaf95W8t5lJD1koIMVXw3WOaEK5s6w7dxzQSJA1hivcBXt1wIgiy8bY6DqSlWgQiB57I9la1LalijRZS8gTfXKXGMOxb42_pUDNvVRZFEpSYXJHvZ0ulAS0TrtRJRsk-r_ieMyHAPqj9mzFkcqHZtOCeotXKwR9e-Xk1mouHM91HTjHjDtPeWfhfnGJNLcngl2t616DZuob21YyO0lyJvhPOZqdniR2wmJlhEI87ws_cNaq0ljulyNElSWLih7eX-klG1GgHWF0oErEW__yEX2trZwp2Q1Qe9jqRsOt5moYRYMrTaSXhSmwX6l-Sc1Nb_E9FbOVHG5KToW-EQxqSw_