<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="646px" preserveAspectRatio="none" style="width:1883px;height:646px;background:#FFFFFF;" version="1.1" viewBox="0 0 1883 646" width="1883px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="300" x="784.75" y="24.5332">&#220;berblick der generischen Organisationen</text><!--entity EmigaDepartmentOrganization--><g id="elem_EmigaDepartmentOrganization"><rect fill="#F1F1F1" height="72.8281" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="453" x="746.5" y="558.1094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="213" x="756.5" y="582.6426">EmigaDepartmentOrganization</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="433" x="756.5" y="600.252">Unter einer Fachabteilung versteht man einen organisatorischen Teil</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="259" x="756.5" y="617.8613">einer Abteilung (nicht der physische Ort).</text></g><!--entity EmigaHealthcareService--><g id="elem_EmigaHealthcareService"><rect fill="#F1F1F1" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="437" x="1440.5" y="324.1094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="172" x="1450.5" y="348.6426">EmigaHealthcareService</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="417" x="1450.5" y="366.252">Beschreibung einer Dienstleistung, die im weitesten Sinne mit dem</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="356" x="1450.5" y="383.8613">Gesundheitswesen assoziiert ist, z. B. Tuberkulosestelle,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="384" x="1450.5" y="401.4707">Lebensmittelpersonal-Beratungsstelle, AIDS-Beratungsstelle.</text></g><!--entity EmigaLocation--><g id="elem_EmigaLocation"><rect fill="#F1F1F1" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="507" x="1339.5" y="549.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="102" x="1349.5" y="574.1426">EmigaLocation</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="487" x="1349.5" y="591.752">Ein 'physischer' Ort, der besucht werden kann. Einem physischen Ort k&#246;nnen</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="447" x="1349.5" y="609.3613">grunds&#228;tzlich Geo-Koordinaten und zumeist auch eine Stra&#223;enadresse</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="125" x="1349.5" y="626.9707">zugeordnet werden.</text></g><!--entity EmigaOrganization--><g id="elem_EmigaOrganization"><rect fill="#F1F1F1" height="160.875" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="619" x="663.5" y="288.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="131" x="673.5" y="313.1426">EmigaOrganization</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="511" x="673.5" y="330.752">Unter der EMIGA Organization werden alle Organisationen zusammengefasst, die</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="554" x="673.5" y="348.3613">NICHT EMIGA direkt nutzende &#214;GD-Organisationen sind, die eine CodeSite-ID besitzen.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="548" x="673.5" y="365.9707">Damit werden unter EMIGA Organisationen sowohl Beh&#246;rden, Transport-Unternehmen,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="599" x="673.5" y="383.5801">wie Krankenh&#228;user, Labore oder Arztpraxen aber auch jede andere Organisation subsummiert.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="496" x="673.5" y="401.1895">Die jeweiligen Organisationen werden durch ihren Typ und/oder ihren Identifier</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="476" x="673.5" y="418.7988">eindeutig charakterisiert. EmigaOrganisationen m&#252;ssen nicht zwingend eine</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="523" x="673.5" y="436.4082">Stra&#223;enanschrift haben, verf&#252;gen h&#228;ufig jedoch zumindest &#252;ber eine Postanschrift.</text></g><!--entity EmigaPractitioner--><g id="elem_EmigaPractitioner"><rect fill="#F1F1F1" height="143.2656" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="540" x="7" y="45.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="124" x="17" y="70.1426">EmigaPractitioner</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="487" x="17" y="87.752">Personen, die im weiteren Sinne einen Bezug zur Erbringung von Leistungen/</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="518" x="17" y="105.3613">Erf&#252;llung von Aufgaben innerhalb der Gesundheitsversorgung (hier: &#214;GD) haben.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="470" x="17" y="122.9707">Dies sind somit explizit nicht nur &#196;rztinnen und &#196;rzte, sondern auch andere</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="408" x="17" y="140.5801">Personengruppen, wie z. B. MitarbeiterInnen im Gesundheitsamt,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="431" x="17" y="158.1895">LeiterInnen/AnsprechpartnerInnen von Gemeinschaftseinrichtungen.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="520" x="17" y="175.7988">Patienten, Kontaktpersonen etc. fallen jedoch explizit NICHT unter diese Kategorie.</text></g><!--entity EmigaPractitionerRole--><g id="elem_EmigaPractitionerRole"><rect fill="#F1F1F1" height="90.4375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="572" x="687" y="72.1094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="156" x="697" y="96.6426">EmigaPractitionerRole</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="511" x="697" y="114.252">Definiert einen bestimmten Satz von Attributen, die einem Practitioner zugeordnet</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="552" x="697" y="131.8613">werden. Dazu geh&#246;ren beispielsweise die Zuordnung zu einer bestimmten Organisation,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="287" x="697" y="149.4707">aber auch die Rolle, die wahrgenommen wird.</text></g><!--link EmigaPractitioner to EmigaPractitionerRole--><!--reverse link EmigaPractitioner to EmigaPractitionerRole--><g id="link_EmigaPractitioner_EmigaPractitionerRole"><path d="M553.09,102.6094 C598.94,102.6094 640.7,102.6094 686.94,102.6094 " fill="none" id="EmigaPractitioner-backto-EmigaPractitionerRole" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="547.09,102.6094,556.09,106.6094,552.09,102.6094,556.09,98.6094,547.09,102.6094" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="93" x="563.52" y="115.0283">Practitioner, der die</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="95" x="566.52" y="128.8643">f&#252;r die Organisation</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="107" x="563.52" y="142.7002">definierten Leistungen</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="72" x="566.52" y="156.5361">erbringen kann</text></g><!--link EmigaDepartmentOrganization to EmigaOrganization--><!--reverse link EmigaOrganization to EmigaDepartmentOrganization--><g id="link_EmigaOrganization_EmigaDepartmentOrganization"><path d="M1048.5,455.8794 C1048.5,492.7894 1048.5,528.6694 1048.5,557.8494 " fill="none" id="EmigaOrganization-backto-EmigaDepartmentOrganization" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1048.5,449.8794,1044.5,458.8794,1048.5,454.8794,1052.5,458.8794,1048.5,449.8794" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="127" x="920.5" y="487.2883">Verwaltende Organisation</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="115" x="920.5" y="501.1243">(managingOrganization)</text></g><!--link EmigaOrganization to EmigaHealthcareService--><!--reverse link EmigaOrganization to EmigaHealthcareService--><g id="link_EmigaOrganization_EmigaHealthcareService"><path d="M1288.63,384.6094 C1341.83,384.6094 1390.1,384.6094 1440.27,384.6094 " fill="none" id="EmigaOrganization-backto-EmigaHealthcareService" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1282.63,384.6094,1291.63,388.6094,1287.63,384.6094,1291.63,380.6094,1282.63,384.6094" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="82" x="1341.45" y="397.0283">bereitgestellt von</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="63" x="1341.45" y="410.8643">(providedBy)</text></g><!--link EmigaOrganization to EmigaLocation--><!--reverse link EmigaOrganization to EmigaLocation--><g id="link_EmigaOrganization_EmigaLocation"><path d="M1241,455.8594 C1241,505.0894 1241,552.6094 1241,552.6094 C1241,552.6094 1283.54,552.6094 1339.05,552.6094 " fill="none" id="EmigaOrganization-backto-EmigaLocation" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1241,449.8594,1237,458.8594,1241,454.8594,1245,458.8594,1241,449.8594" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="127" x="1113" y="533.6783">Verwaltende Organisation</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="115" x="1113" y="547.5143">(managingOrganization)</text></g><!--link EmigaPractitionerRole to EmigaOrganization--><!--link EmigaPractitionerRole to EmigaOrganization--><g id="link_EmigaPractitionerRole_EmigaOrganization"><path d="M877.67,162.1594 C877.67,197.1994 877.67,240.7194 877.67,282.5394 " fill="none" id="EmigaPractitionerRole-to-EmigaOrganization" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="877.67,288.5394,881.67,279.5394,877.67,283.5394,873.67,279.5394,877.67,288.5394" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="137" x="739.67" y="208.7683">Organisation, in der die Rolle</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="112" x="739.67" y="222.6043">ausge&#252;bt werden kann</text></g><!--link EmigaPractitionerRole to EmigaHealthcareService--><g id="link_EmigaPractitionerRole_EmigaHealthcareService"><path d="M1259.45,117.6094 C1447.56,117.6094 1659,117.6094 1659,117.6094 C1659,117.6094 1659,245.4494 1659,317.8594 " fill="none" id="EmigaPractitionerRole-to-EmigaHealthcareService" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1659,323.8594,1663,314.8594,1659,318.8594,1655,314.8594,1659,323.8594" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="175" x="1317.35" y="101.0283">Dienstleistungen, die der Practitioner</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="244" x="1317.35" y="114.8643">f&#252;r die Organisation bzw. deren Standorte erbringt</text></g><!--reverse link EmigaOrganization to EmigaOrganization--><g id="link_EmigaOrganization_EmigaOrganization"><path d="M1270.75,282.3194 C1270.75,255.6194 1270.75,238.6094 1270.75,238.6094 C1270.75,238.6094 1311,238.6094 1311,238.6094 C1311,238.6094 1311,499.6094 1311,499.6094 C1311,499.6094 1261.75,499.6094 1261.75,499.6094 C1261.75,499.6094 1261.75,476.5994 1261.75,449.8994 " fill="none" id="EmigaOrganization-backto-EmigaOrganization" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1270.75,288.3194,1274.75,279.3194,1270.75,283.3194,1266.75,279.3194,1270.75,288.3194" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="37" x="1317" y="352.0283">Teil von</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="39" x="1317" y="365.8643">(partOf)</text></g><!--link EmigaHealthcareService to EmigaLocation--><g id="link_EmigaHealthcareService_EmigaLocation"><path d="M1643.5,414.1994 C1643.5,453.5294 1643.5,504.2894 1643.5,543.5994 " fill="none" id="EmigaHealthcareService-to-EmigaLocation" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1643.5,549.5994,1647.5,540.5994,1643.5,544.5994,1639.5,540.5994,1643.5,549.5994" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="147" x="1431.5" y="451.3183">Referenzierung der Standorte,</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="211" x="1431.5" y="465.1543">an denen die Dienstleistung angeboten wird</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="45" x="1431.5" y="478.9902">(location)</text></g><!--SRC=[hLV1Rjj64BthAnQvE34a9m5wyY6072ME4QSn8hU7LZqinH6v4JbBx2wZcET-Gqy5UiatvEIRVgnlbg9CsLA21lM99dTdthnvytOLJ2X8hVzEo2M5cIzLIavbnEICd-V4whtBD1klWx5CF1W4MwbWLM93iALAZQEvV1eC_D9mfPqkbSzrQbU6CxNGXQVUby8mXPkAb7KXjxqFAIrqNOHh-Xp6XScu90wge4NehHaxPrUlBOUfQKWzVzvFoJObJvLw_jEptbkdUHdVFdis60m4gUOCvJuwFdvLcanF2Ek2v6ghR6ALnySp_eK3U230TUgrdkSw2MIA6YLz8kS3vK6LckC2HZ4RYcn7sZKMpxZTFjvkVSncZet2S9NV-BWM_8Od9u-KzkeRaFQ1VqEw2FbSEvgI-sJc9BZF244TcKJojVadXjYZoSO7l1oYPQHCgLPa0g4ILbF3JAeqWgoSyJdvcjCSd_qAd3AWUTiOGouen1YgvaITdQZh6f9PreNr4gKeQ3ZZIqgG2v7meW9FbdKnEYEd9RFVB5FZYydq_jiU0m_gsbVyfPrlU_NAi3hQ4kgEXD9XP3b1ASBuYboAGfQQ-KHXEPLt3H251xLSVmK9FEFCeNY__X8QJ4EkpicEtbhhKiDQkC97rTIbaAaqOaUErJGulVw7MAUElASPDtL6s0InRtBtwkkWxojhlmobb5VlBix7gl-zgqg3ldjJ2eXUbn1HXh7oqZCqVSO_NxnySxs998Ex38hhq12dS82_pYUZUr6yuRJLIwpo9MPi2j6CBYR2h96T9pEUQ97E1amT0VV1taMpAviNwepozLTPErJNc4zVmGf6iKwc790XenKolfNP9SxNNsfFRgWkTM8TV4Eu6BicL4v_bk8XmhOH7mbLQ9JYTjbGlavyNPQYNq6Bs1y9ueVBF72thegqTeXeC4WOvPjAkluqPcvVNM1DC0j4Z3EUKXrCfc0IJY-366VCfNeTtIOerxTUPgfrWaPC4lH7VcUybH7B49j5KF0T8GgUirZV2bxXOu5agDO28gGe-I76zMsoCInrPNtOXkW9xtk6SkKqh3m2TIA-gpZ1ahzl6Mxh6AtvdH743Y3ekaiSweac2TulDuv3_1GpAWKKHVTjN2yoAKr989Vh8eaYxrcFs2nyDTfc3ZvFeqAVj8oqVVHHeD2Lw8y-LuLfyD0ooy2p_XCwaGJjsCP_OJ-e2RcuLKqhcBjQCVvL9IMB1bkZUsU2Taai_I860nCzeBeCqVcstv-E8MgmcukHSxT9gZud